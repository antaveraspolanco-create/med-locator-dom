      {/* HEADER */}
      <header className="w-full bg-[#015993] shadow-lg sticky top-0 z-50">
        <div className="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
          <div className="flex items-center gap-4">
            <div className="w-12 h-12 rounded-xl bg-white flex items-center justify-center shadow-md">
              <Hospital className="w-7 h-7 text-[#015993]" />
            </div>
            <div>
              <h1 className="text-xl font-black text-white tracking-tight leading-none uppercase">
                ARS PRIMERA
              </h1>
              <p className="text-blue-100 text-[10px] font-bold mt-1 uppercase tracking-[0.2em]">
                Gestión de Red & Georreferencia
              </p>
            </div>
          </div>
          <Button onClick={() => setShowCard(!showCard)} variant="secondary">
            {showCard ? "Editar Datos" : "Generar Reporte"}
          </Button>
        </div>
      </header>

      <main className="max-w-7xl mx-auto px-4 py-8">
        <div className="grid lg:grid-cols-12 gap-8">
          
          {/* PANEL DE CONTROL */}
          <div className="lg:col-span-5 space-y-6">
            <section className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
              <div className="flex items-center gap-2 mb-6 border-b pb-4">
                <BarChart3 className="w-5 h-5 text-[#015993]" />
                <h2 className="font-bold text-slate-800 uppercase text-sm tracking-wider">Configuración General</h2>
              </div>
              
              <div className="space-y-4">
                <div>
                  <label className="text-[10px] font-black uppercase text-slate-400 mb-1 block">Nombre del Centro</label>
                  <input 
                    type="text" 
                    value={report.centerName}
                    onChange={(e) => setReport({...report, centerName: e.target.value})}
                    className="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none"
                  />
                </div>
                <div className="grid grid-cols-2 gap-4">
                  <div>
                    <label className="text-[10px] font-black uppercase text-slate-400 mb-1 block">Localidad</label>
                    <input 
                      type="text" 
                      value={report.localidad}
                      onChange={(e) => setReport({...report, localidad: e.target.value})}
                      className="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none"
                    />
                  </div>
                  <div>
                    <label className="text-[10px] font-black uppercase text-slate-400 mb-1 block">Especialidad</label>
                    <input 
                      type="text" 
                      value={report.especialidad}
                      onChange={(e) => setReport({...report, especialidad: e.target.value})}
                      className="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none"
                    />
                  </div>
                </div>
              </div>
            </section>

            <section className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
              <div className="flex items-center justify-between mb-4">
                <div className="flex items-center gap-2">
                  <Users className="w-5 h-5 text-blue-500" />
