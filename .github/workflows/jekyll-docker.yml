              <div className="p-8">
                {showCard ? (
                  <div className="bg-white border shadow-2xl rounded-lg overflow-hidden max-w-[600px] mx-auto">
                    {/* Diseño tipo Card para exportar */}
                    <div className="bg-[#015993] p-6 text-white text-center">
                      <h3 className="text-xl font-bold uppercase tracking-widest">{report.centerName}</h3>
                      <p className="text-blue-100 text-sm mt-1">📍 {report.localidad}</p>
                    </div>
                    
                    <div className="p-6 space-y-6">
                      <div className="grid grid-cols-2 gap-4">
                        <div className="p-4 bg-slate-50 rounded-xl border border-slate-100 text-center">
                          <p className="text-[10px] uppercase font-black text-slate-400">Puntaje Viabilidad</p>
