import React, { useState, useRef } from "react";
import { 
  Download, 
  Activity, 
  Hospital, 
  MapPin, 
  BarChart3, 
  Users, 
  Plus, 
  Trash2, 
  Info,
  CheckCircle2,
  AlertCircle
} from "lucide-react";

/**
 * Simulando componentes y utilidades que fallaron en la compilación
 * para garantizar que el archivo sea autocontenido y funcional.
 */

const Button = ({ children, onClick, variant = "primary", className = "", size = "md" }) => {
  const variants = {
    primary: "bg-[#015993] text-white hover:bg-blue-800",
    secondary: "bg-slate-200 text-slate-700 hover:bg-slate-300",
    outline: "border-2 border-[#015993] text-[#015993] hover:bg-blue-50",
    ghost: "text-white hover:bg-white/10",
    danger: "bg-red-500 text-white hover:bg-red-600"
  };
  const sizes = {
    sm: "px-3 py-1.5 text-xs",
    md: "px-4 py-2 text-sm",
    lg: "px-6 py-3 text-base"
  };
  return (
    <button 
      onClick={onClick} 
      className={`rounded-lg font-bold transition-all flex items-center justify-center gap-2 ${variants[variant]} ${sizes[size]} ${className}`}
    >
      {children}
    </button>
  );
};

// Mock de la función de descarga para evitar dependencia de html-to-image
const simulateDownload = (name) => {
  const toast = document.getElementById('custom-toast');
  toast.innerText = `Generando imagen: ${name}...`;
  toast.style.display = 'block';
  setTimeout(() => {
    toast.style.display = 'none';
    alert("En un entorno real, aquí se descargaría el PNG del reporte con el mapa y los KPIs.");
  }, 2000);
};

const Index = () => {
  const [showCard, setShowCard] = useState(false);
  const [report, setReport] = useState({
    centerName: "Clínica de Especialidades Médicas",
    localidad: "Santo Domingo Centro",
    especialidad: "Cardiología",
    puntaje: 85,
    radio: "3 km",
    nearbyCenters: [
      { id: 1, nombre: "Centro Médico A", tipo: "Similitud", dist: "0.5km" },
      { id: 2, nombre: "Hospital Regional B", tipo: "Competencia", dist: "1.2km" }
    ],
    kpiPacientes: "1,240",
    kpiCosto: "$4,500",
    kpiResolutividad: "92%"
  });

  const handleAddCenter = () => {
    const newId = report.nearbyCenters.length + 1;
    setReport(prev => ({
      ...prev,
      nearbyCenters: [...prev.nearbyCenters, { id: newId, nombre: `Nuevo Centro ${newId}`, tipo: "Similitud", dist: "---" }]
    }));
  };

  const removeCenter = (id) => {
    setReport(prev => ({
      ...prev,
      nearbyCenters: prev.nearbyCenters.filter(c => c.id !== id)
    }));
  };

