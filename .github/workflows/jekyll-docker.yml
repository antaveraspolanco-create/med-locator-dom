                           <div className="absolute top-4 left-4 text-[10px] opacity-50 font-mono">MAPA_ESTATICO_GEN</div>
                           <p className="text-[10px] text-slate-400 mt-auto">Vista de {report.radio} a la redonda</p>
                        </div>
                        <p className="text-[11px] text-slate-500 italic">
                          El centro presenta un entorno con {report.nearbyCenters.length} prestadores de similares características, permitiendo una competencia equilibrada en {report.localidad}.
                        </p>
                      </div>

                      <div className="grid grid-cols-3 gap-2">
                        <div className="p-3 bg-blue-50 rounded-lg text-center">
                          <p className="text-[9px] uppercase font-bold text-blue-400">Pacientes</p>
                          <p className="text-sm font-black text-blue-700">{report.kpiPacientes}</p>
                        </div>
                        <div className="p-3 bg-blue-50 rounded-lg text-center">
                          <p className="text-[9px] uppercase font-bold text-blue-400">Costo Medio</p>
                          <p className="text-sm font-black text-blue-700">{report.kpiCosto}</p>
                        </div>
                        <div className="p-3 bg-blue-50 rounded-lg text-center">
                          <p className="text-[9px] uppercase font-bold text-blue-400">Resolución</p>
                          <p className="text-sm font-black text-blue-700">{report.kpiResolutividad}</p>
                        </div>
                      </div>
                    </div>
                    
                    <div className="bg-slate-50 p-4 text-center border-t">
                      <p className="text-[9px] text-slate-400 font-bold uppercase tracking-widest">© 2024 Ars Primera - Reporte Geográfico</p>
                    </div>
                  </div>
                ) : (
                  <div className="flex flex-col items-center justify-center py-20 text-center text-slate-400 border-2 border-dashed rounded-3xl border-slate-100">
                    <AlertCircle className="w-12 h-12 mb-4 opacity-20" />
                    <p className="text-sm max-w-xs">Introduce y ajusta los parámetros del prestador a la izquierda para visualizar el análisis médico-geográfico.</p>
                  </div>
                )}
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  );
};

export default Index;
