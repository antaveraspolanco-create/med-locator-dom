              </div>
              
              <div className="space-y-2 max-h-60 overflow-y-auto pr-2">
                {report.nearbyCenters.map((centro) => (
                  <div key={centro.id} className="flex items-center justify-between p-3 bg-slate-50 rounded-xl border border-slate-100 group">
                    <div>
                      <p className="text-xs font-bold text-slate-700">{centro.nombre}</p>
                      <p className="text-[10px] text-slate-400 uppercase font-medium">{centro.tipo} • {centro.dist}</p>
                    </div>
                    <button onClick={() => removeCenter(centro.id)} className="p-2 text-slate-300 hover:text-red-500 transition-colors">
